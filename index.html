<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LazyQueue</title>
<style>
body{margin:0;padding:16px;font:16px system-ui,sans-serif;background:#0e1116;color:#e6e6e6}
button,select,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #333;background:#1b2028;color:inherit}
button:disabled{opacity:.4}
button.primary{background:#c89b3c;color:#111;border:0;font-weight:600}
input[type=text]{width:100%;box-sizing:border-box;margin:8px 0}
h3{margin:16px 0 4px;font-size:14px;color:#999}
.row{display:flex;gap:8px;margin:8px 0;align-items:center}
.row>*{flex:1}
.hidden{display:none}
#status{font-size:20px;font-weight:600}
#err{color:#ff6b6b;min-height:1.2em;margin:4px 0}
#banner{background:#c89b3c;color:#111;padding:12px;border-radius:8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:45vh;overflow-y:auto}
.grid button{padding:4px;font-size:11px;overflow:hidden}
.grid button.sel,.slot.sel{outline:2px solid #c89b3c}
.grid img{width:100%;display:block;border-radius:4px}
.slot{display:flex;align-items:center;gap:8px;padding:6px}
.slot img{width:40px;height:40px;border-radius:4px}
.trees{display:flex;gap:6px;margin:6px 0}
.trees button{flex:1;padding:6px;min-width:0}
.trees button.on{outline:2px solid #c89b3c}
.trees img{width:28px;height:28px;display:block;margin:0 auto}
.rrow{display:flex;gap:10px;justify-content:center;margin:8px 0}
.rrow button{width:48px;height:48px;padding:3px;border-radius:50%;opacity:.35}
.rrow.key button{width:60px;height:60px}
.rrow.shard button{width:36px;height:36px}
.rrow button.on{opacity:1;outline:2px solid #c89b3c}
.rrow img{width:100%;height:100%;display:block}
#rdesc{min-height:2.6em;font-size:13px;color:#bbb;margin:8px 0}
.reco{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0;text-align:left}
.reco img{width:36px;height:36px;flex:0 0 auto}
.reco img.tree{width:20px;height:20px}
.reco span{flex:1;font-size:14px}
.reco small{display:block;color:#999;font-size:12px}
</style>
</head>
<body>
<div class="row" style="margin:0"><div id="status">Connexion...</div><div id="ping" style="flex:0 0 auto;font-size:12px;color:#777"></div></div>
<div id="banner" class="hidden"></div>
<div id="err"></div>
<label class="row" style="justify-content:flex-start"><input type="checkbox" id="auto" style="flex:0"> Auto-accept</label>

<section id="offline" class="hidden">
  <button class="primary" data-action="launch" style="width:100%">Lancer le client</button>
</section>

<section id="lobby" class="hidden">
  <div class="row">
    <select id="queue">
      <option value="420">Classée Solo/Duo</option>
      <option value="440">Classée Flex</option>
      <option value="400">Normale Draft</option>
      <option value="480">Partie accélérée</option>
      <option value="450">ARAM</option>
    </select>
    <button data-action="lobby">Créer lobby</button>
  </div>
  <div class="row">
    <button class="primary" data-action="search">Lancer</button>
    <button data-action="cancel">Annuler</button>
  </div>
</section>

<section id="ready" class="hidden">
  <div class="row">
    <button class="primary" data-action="accept">Accepter</button>
    <button data-action="decline">Refuser</button>
  </div>
</section>

<section id="cs" class="hidden">
  <div class="row"><span id="csinfo"></span><span id="timer" style="text-align:right"></span></div>
  <input type="text" id="filter" placeholder="Champion" autocomplete="off">
  <div id="grid" class="grid"></div>
  <div class="row"><button id="fav" style="flex:0 0 auto">★ Favori</button><button class="primary" id="lock">Verrouiller</button></div>

  <h3>Sorts d'invocateur</h3>
  <div class="row">
    <button class="slot" data-slot="0"></button>
    <button class="slot" data-slot="1"></button>
  </div>
  <div id="spellgrid" class="grid hidden"></div>

</section>

<section id="runesec" class="hidden">
  <h3>Page de runes</h3>
  <div class="row"><select id="runes"></select><button id="editrunes" style="flex:0 0 auto">Modifier</button></div>
  <div id="recos" class="hidden">
    <h3 id="recotitle"></h3>
    <div id="recolist"></div>
  </div>
  <div id="editor" class="hidden">
    <input type="text" id="rname" maxlength="25" placeholder="Nom de la page" autocomplete="off">
    <h3>Arbre principal</h3>
    <div id="rprim" class="trees"></div>
    <div id="rprimrows"></div>
    <h3>Arbre secondaire</h3>
    <div id="rsub" class="trees"></div>
    <div id="rsubrows"></div>
    <h3>Fragments</h3>
    <div id="rshards"></div>
    <div id="rdesc"></div>
    <div class="row"><button id="rcancel">Annuler</button><button class="primary" id="rsave">Enregistrer</button></div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const ICON = id => `/asset/v1/champion-icons/${id}.png`;
const PHASES = {Offline: "Client fermé", None: "Menu", Lobby: "Lobby", Matchmaking: "Recherche...",
  ReadyCheck: "Partie trouvée", ChampSelect: "Sélection", InProgress: "En jeu",
  WaitingForStats: "Fin de partie", EndOfGame: "Fin de partie"};

let token = new URLSearchParams(location.search).get("token");
try {
  if (token) localStorage.setItem("token", token); else token = localStorage.getItem("token");
} catch (_) {}
history.replaceState(null, "", "/");

let ws, champions = [], spells = [], pickable = [], bannable = [], favorites = [], cs = null;
let runeStyles = [], perks = {}, runePages = [], draft = null, recommended = null, phase = "Offline";
let selected = null, actionId = null, deadline = 0, slot = null;

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function setPhase(p) {
  $("status").textContent = PHASES[p] || p;
  $("offline").classList.toggle("hidden", p !== "Offline");
  $("lobby").classList.toggle("hidden", !["None", "Lobby", "Matchmaking"].includes(p));
  $("ready").classList.toggle("hidden", p !== "ReadyCheck");
  $("cs").classList.toggle("hidden", p !== "ChampSelect");
  $("runesec").classList.toggle("hidden", p === "Offline");
  phase = p;
  renderRecos();
  if (p !== "ReadyCheck" && p !== "ChampSelect") $("banner").classList.add("hidden");
}

function target() {
  if (selected) return selected;
  if (!cs) return null;
  const a = cs.action;
  const pos = x => x > 0 ? x : null;
  if (a) return pos(a.championId) || (a.type === "pick" ? pos(cs.championId) : null);
  return pos(cs.championId);
}

function highlight() {
  const t = target();
  for (const b of $("grid").children) b.classList.toggle("sel", +b.dataset.id === t);
  $("lock").disabled = !(cs && cs.action && t);
  $("fav").disabled = !t;
  $("fav").textContent = t && favorites.includes(t) ? "Retirer des favoris" : "★ Favori";
}

function renderCs(data) {
  cs = data;
  if (!data) { selected = null; actionId = null; deadline = 0; slot = null; renderSpells(); return; }
  const a = data.action;
  const id = a ? a.id : null;
  if (id !== actionId) { actionId = id; selected = null; renderGrid(); }
  deadline = Date.now() + data.timer;
  $("csinfo").textContent = a ? (a.type === "ban" ? "À toi de bannir" : "À toi de choisir")
    : data.phase === "PLANNING" ? "Pré-sélection" : data.phase === "FINALIZATION" ? "Finalisation" : "En attente";
  $("lock").textContent = a ? (a.type === "ban" ? "Bannir" : "Verrouiller")
    : data.phase === "PLANNING" ? "Pré-sélection (pas encore ton tour)" : "Pas encore ton tour";
  highlight();
  renderSpells();
}

function tile(icon, label, isSel, onclick, id) {
  const b = document.createElement("button");
  if (id) b.dataset.id = id;
  const img = document.createElement("img");
  img.loading = "lazy";
  img.src = icon;
  b.append(img, label);
  if (isSel) b.className = "sel";
  b.onclick = onclick;
  return b;
}

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

function renderGrid() {
  const q = norm($("filter").value);
  const banning = cs && cs.action && cs.action.type === "ban";
  const list = banning ? bannable : pickable;
  const allowed = new Set(list.length > 1 ? list : []);
  const fav = new Set(favorites);
  const seen = new Set();
  $("grid").replaceChildren(...champions
    .filter(c => (allowed.size ? allowed.has(c.id) : !seen.has(c.name) && seen.add(c.name)) && norm(c.name).includes(q))
    .sort((a, b) => fav.has(b.id) - fav.has(a.id) || (q && norm(b.name).startsWith(q) - norm(a.name).startsWith(q)))
    .map(c => tile(ICON(c.id), (fav.has(c.id) ? "★ " : "") + c.name, false, () => {
      selected = c.id;
      send({action: "select", championId: c.id});
      highlight();
    }, c.id)));
  highlight();
}

let spellKey = "";
function renderSpells() {
  const current = cs ? cs.spells : [0, 0];
  const key = JSON.stringify([current, slot, spells.map(s => s.id)]);
  if (key === spellKey) return;
  spellKey = key;
  document.querySelectorAll(".slot").forEach(b => {
    const i = +b.dataset.slot;
    const s = spells.find(x => x.id === current[i]);
    b.classList.toggle("sel", slot === i);
    b.replaceChildren();
    if (s) { const img = document.createElement("img"); img.src = "/asset/" + s.icon; b.append(img); }
    b.append(s ? s.name : (i ? "F" : "D"));
  });
  $("spellgrid").classList.toggle("hidden", slot === null);
  if (slot === null) return;
  const open = slot;
  $("spellgrid").replaceChildren(...spells.map(s => tile("/asset/" + s.icon, s.name, s.id === current[open], () => {
    const next = [current[0] || 0, current[1] || 0];
    const other = 1 - open;
    if (next[other] === s.id) next[other] = next[open];
    next[open] = s.id;
    send({action: "spells", spell1Id: next[0], spell2Id: next[1]});
    slot = null;
    renderSpells();
  })));
}

function renderQueues(queues) {
  if (!queues || !queues.length) return;
  let saved = $("queue").value;
  try { saved = localStorage.getItem("queue") || saved; } catch (_) {}
  $("queue").replaceChildren(...queues.map(q => {
    const o = document.createElement("option");
    o.value = q.id;
    o.textContent = q.name;
    o.selected = String(q.id) === saved;
    return o;
  }));
}

function renderRunes(pages) {
  runePages = pages;
  $("runes").replaceChildren(...pages.map(p => {
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.name;
    o.selected = draft ? p.id === draft.id : p.current;
    return o;
  }));
}

const style = id => runeStyles.find(s => s.id === id);
const rows = (st, test) => st ? st.slots.filter(test).map(s => s.perks) : [];
const mainRows = st => rows(st, s => s.type !== "kStatMod");
const subRows = st => rows(st, s => s.type === "kMixedRegularSplashable");
const shardRows = st => rows(st, s => s.type === "kStatMod");

function renderRecos() {
  const r = recommended;
  const show = phase === "ChampSelect" && r && r.pages.length && runeStyles.length;
  $("recos").classList.toggle("hidden", !show);
  if (!show) return;
  const champ = champions.find(c => c.id === r.championId);
  $("recotitle").textContent = `Recommandées pour ${champ ? champ.name : "ton champion"}`;
  $("recolist").replaceChildren(...r.pages.map((p, i) => {
    const b = document.createElement("button");
    b.className = "reco";
    b.dataset.reco = i;
    const key = document.createElement("img");
    key.src = "/asset/" + ((perks[p.perks[0]] || {}).icon || "");
    const trees = [p.primary, p.sub].map(id => {
      const img = document.createElement("img");
      img.className = "tree";
      img.src = "/asset/" + ((style(id) || {}).icon || "");
      return img;
    });
    const text = document.createElement("span");
    const small = document.createElement("small");
    small.textContent = p.label;
    text.append(p.keystone, small);
    b.append(key, text, ...trees);
    b.onclick = () => applyReco(p, champ);
    return b;
  }));
}

function applyReco(reco, champ) {
  if (!openEditor()) return;
  draft.primary = reco.primary;
  draft.sub = reco.sub;
  draft.prim = reco.perks.slice(0, 4);
  draft.sec = reco.perks.slice(4, 6);
  draft.shards = reco.perks.slice(6, 9);
  $("rname").value = `${champ ? champ.name + " " : ""}${reco.keystone}`.slice(0, 25);
  $("rdesc").textContent = "Recommandation chargée : vérifie puis appuie sur Enregistrer.";
  renderEditor();
}

function openEditor() {
  const p = runePages.find(x => x.id === +$("runes").value);
  if (!p) return false;
  if (!p.editable) { showError("Cette page n'est pas modifiable"); return false; }
  if (!runeStyles.length) { showError("Données de runes pas encore chargées"); return false; }
  draft = {id: p.id, primary: p.primary, sub: p.sub,
    prim: p.perks.slice(0, 4), sec: p.perks.slice(4, 6), shards: p.perks.slice(6, 9)};
  $("rname").value = p.name;
  $("rdesc").textContent = "";
  $("editor").classList.remove("hidden");
  $("editrunes").classList.add("hidden");
  renderEditor();
  return true;
}

function closeEditor() {
  draft = null;
  $("editor").classList.add("hidden");
  $("editrunes").classList.remove("hidden");
  renderRunes(runePages);
}

function treeButtons(ids, current, onpick) {
  return ids.map(id => {
    const s = style(id);
    const b = document.createElement("button");
    const img = document.createElement("img");
    img.src = "/asset/" + s.icon;
    img.alt = s.name;
    b.append(img);
    b.title = s.name;
    b.dataset.style = id;
    b.classList.toggle("on", id === current);
    b.onclick = () => onpick(id);
    return b;
  });
}

function perkRow(ids, isOn, onpick, cls) {
  const row = document.createElement("div");
  row.className = "rrow" + (cls ? " " + cls : "");
  row.append(...ids.map(id => {
    const p = perks[id] || {name: "?", icon: "", desc: ""};
    const b = document.createElement("button");
    const img = document.createElement("img");
    img.src = "/asset/" + p.icon;
    img.alt = p.name;
    b.append(img);
    b.dataset.perk = id;
    b.classList.toggle("on", isOn(id));
    b.onclick = () => { onpick(id); $("rdesc").textContent = `${p.name} : ${p.desc}`; renderEditor(); };
    return b;
  }));
  return row;
}

function draftPerks() {
  const sr = subRows(style(draft.sub));
  const rowOf = id => sr.findIndex(r => r.includes(id));
  const sec = [...draft.sec].sort((a, b) => rowOf(a) - rowOf(b));
  return [...draft.prim, ...sec, ...draft.shards];
}

function draftComplete() {
  const mr = mainRows(style(draft.primary)), sr = subRows(style(draft.sub)), hr = shardRows(style(draft.primary));
  return draft.prim.length === 4 && draft.prim.every((id, i) => mr[i] && mr[i].includes(id))
    && draft.sec.length === 2 && draft.sec.every(id => sr.some(r => r.includes(id)))
    && new Set(draft.sec.map(id => sr.findIndex(r => r.includes(id)))).size === 2
    && draft.shards.length === 3 && draft.shards.every((id, i) => hr[i] && hr[i].includes(id));
}

function renderEditor() {
  if (!draft) return;
  const prim = style(draft.primary);
  $("rprim").replaceChildren(...treeButtons(runeStyles.map(s => s.id), draft.primary, id => {
    if (id === draft.primary) return;
    draft.primary = id;
    draft.prim = [0, 0, 0, 0];
    if (!style(id).subStyles.includes(draft.sub)) { draft.sub = style(id).subStyles[0]; draft.sec = []; }
    renderEditor();
  }));
  $("rprimrows").replaceChildren(...mainRows(prim).map((ids, i) =>
    perkRow(ids, id => draft.prim[i] === id, id => { draft.prim[i] = id; }, i === 0 ? "key" : "")));
  $("rsub").replaceChildren(...treeButtons(prim ? prim.subStyles : [], draft.sub, id => {
    if (id === draft.sub) return;
    draft.sub = id;
    draft.sec = [];
    renderEditor();
  }));
  const sr = subRows(style(draft.sub));
  $("rsubrows").replaceChildren(...sr.map(ids => perkRow(ids, id => draft.sec.includes(id), id => {
    if (draft.sec.includes(id)) { draft.sec = draft.sec.filter(x => x !== id); return; }
    draft.sec = draft.sec.filter(x => !ids.includes(x));
    draft.sec.push(id);
    if (draft.sec.length > 2) draft.sec.shift();
  })));
  $("rshards").replaceChildren(...shardRows(prim).map((ids, i) =>
    perkRow(ids, id => draft.shards[i] === id, id => { draft.shards[i] = id; }, "shard")));
  const done = draftComplete();
  $("rsave").disabled = !done;
  $("rsave").textContent = done ? "Enregistrer" : "Page incomplète";
}

function showError(msg) {
  $("err").textContent = msg;
  setTimeout(() => { if ($("err").textContent === msg) $("err").textContent = ""; }, 8000);
}

function alertUser(title, message) {
  $("banner").textContent = `${title} - ${message}`;
  $("banner").classList.remove("hidden");
  if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
}

function connect() {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token || "")}`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    switch (m.type) {
      case "init":
        champions = m.champions; spells = m.spells; pickable = m.pickable; bannable = m.bannable; favorites = m.favorites || [];
        runeStyles = m.rune_styles || []; perks = m.perks || {}; recommended = m.recommended;
        $("auto").checked = m.auto_accept;
        setPhase(m.phase); renderCs(m.champselect); renderGrid(); renderRunes(m.rune_pages); renderQueues(m.queues); break;
      case "queues": renderQueues(m.queues); break;
      case "favorites": favorites = m.favorites; renderGrid(); break;
      case "rune_data": runeStyles = m.styles; perks = m.perks; renderEditor(); renderRecos(); break;
      case "recommended": recommended = m; renderRecos(); break;
      case "rune_saved": if (draft && draft.id === m.pageId) { closeEditor(); alertUser("Runes", "Page enregistrée"); } break;
      case "phase": setPhase(m.phase); break;
      case "champselect": renderCs(m.data); break;
      case "champions": champions = m.champions; renderGrid(); break;
      case "cs_data":
        pickable = m.pickable; bannable = m.bannable; spells = m.spells;
        renderGrid(); renderSpells(); break;
      case "rune_pages": renderRunes(m.pages); break;
      case "auto_accept": $("auto").checked = m.value; break;
      case "notify": alertUser(m.title, m.message); break;
      case "error": showError(m.message); break;
      case "pong": onPong(m.t); break;
    }
  };
  ws.onopen = () => { retryDelay = 250; ping(); };
  ws.onclose = async () => {
    let msg = "Agent injoignable (même Wi-Fi ? agent lancé ?)";
    try {
      const r = await fetch(`/ws?token=${encodeURIComponent(token || "")}`);
      if (r.status === 403) msg = "Non appairé : scanne le QR code affiché dans le terminal du Mac";
    } catch (_) {}
    $("status").textContent = msg;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 2000);
  };
}

let retryDelay = 250, retryTimer = null, rtts = [];
function ping() { send({action: "ping", t: performance.now()}); }
function onPong(t) {
  rtts = [...rtts.slice(-9), performance.now() - t];
  const sorted = [...rtts].sort((a, b) => a - b);
  $("ping").textContent = `${Math.round(sorted[sorted.length >> 1])} ms`;
}
setInterval(() => { if (!document.hidden) ping(); }, 3000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) { clearTimeout(retryTimer); connect(); }
  else ping();
});

document.querySelectorAll("[data-action]").forEach(b => {
  b.onclick = () => send(b.dataset.action === "lobby"
    ? {action: "lobby", queueId: +$("queue").value}
    : {action: b.dataset.action});
});
document.querySelectorAll(".slot").forEach(b => {
  b.onclick = () => { slot = slot === +b.dataset.slot ? null : +b.dataset.slot; renderSpells(); };
});
$("auto").onchange = e => send({action: "auto_accept", value: e.target.checked});
$("lock").onclick = () => { const t = target(); if (t) send({action: "select", championId: t, lock: true}); };
$("fav").onclick = () => { const t = target(); if (t) send({action: "favorite", championId: t}); };
$("filter").oninput = renderGrid;
$("runes").onchange = e => { if (draft) closeEditor(); send({action: "runes", pageId: +e.target.value}); };
$("editrunes").onclick = openEditor;
$("rcancel").onclick = closeEditor;
$("rsave").onclick = () => {
  if (!draft || !draftComplete()) return;
  send({action: "save_runes", pageId: draft.id, name: $("rname").value, primary: draft.primary, sub: draft.sub, perks: draftPerks()});
};
$("queue").onchange = e => { try { localStorage.setItem("queue", e.target.value); } catch (_) {} };
setInterval(() => {
  $("timer").textContent = deadline ? Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) + " s" : "";
}, 250);

connect();
</script>
</body>
</html>
