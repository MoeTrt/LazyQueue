name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-build.txt
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: LazyQueue-${{ runner.os }}
          path: |
            dist/LazyQueue.exe
            dist/LazyQueue-macOS.zip
          if-no-files-found: ignore
